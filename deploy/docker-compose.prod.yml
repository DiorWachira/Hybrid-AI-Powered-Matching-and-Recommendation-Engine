# Production stack for a single VM: Caddy (HTTPS) -> FastAPI -> PostgreSQL + Neo4j.
# Only Caddy publishes ports; the API and databases are reachable on the private network only.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
name: jobbridge

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    <<: *restart
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      start_period: 120s
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: jobbridge-api:latest
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      CORS_ORIGINS: '["https://${APP_DOMAIN}"]'
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  web:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: jobbridge-web:latest
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  caddy-data:
  caddy-config:
